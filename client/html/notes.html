<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Notes — Advocate CMS</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="app-layout">
  <aside class="sidebar" id="sidebar"></aside>
  <div class="main-content">
    <header class="topbar">
      <button class="sidebar-toggle icon-btn" id="sidebar-toggle">☰</button>
      <div class="topbar-actions">
        <button class="icon-btn" id="theme-toggle">☀️</button>
        <div class="avatar" id="topbar-avatar" style="width:32px;height:32px;font-size:13px;cursor:pointer;" onclick="window.location.href='profile.html'">A</div>
      </div>
    </header>
    <main class="page-content">
      <div class="page-header">
        <div><h1 class="page-title">Case Notes & Timeline</h1><p class="page-subtitle">Track case progress and add activity notes</p></div>
      </div>

      <div style="display:grid;grid-template-columns:300px 1fr;gap:16px;" class="notes-layout">
        <!-- Case Selector -->
        <div class="card">
          <div class="card-header"><div class="card-title">📁 Select Case</div></div>
          <div class="search-wrapper" style="margin-bottom:12px;">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" style="width:100%;" placeholder="Search cases..." id="case-search" oninput="filterCaseList()">
          </div>
          <div id="case-list" style="max-height:500px;overflow-y:auto;">
            <div class="loading-overlay" style="padding:24px;"><div class="spinner"></div></div>
          </div>
        </div>

        <!-- Notes Panel -->
        <div>
          <div id="notes-placeholder" class="card" style="text-align:center;padding:60px 20px;">
            <div style="font-size:48px;margin-bottom:12px;">📝</div>
            <h3 style="font-size:16px;font-weight:600;margin-bottom:6px;">Select a Case</h3>
            <p style="font-size:13px;color:var(--text-muted);">Choose a case from the left to view and add notes.</p>
          </div>

          <div id="notes-panel" class="hidden">
            <!-- Add Note -->
            <div class="card" style="margin-bottom:16px;">
              <div class="card-header"><div class="card-title" id="selected-case-title">Notes</div></div>
              <div style="display:flex;gap:10px;margin-bottom:12px;">
                <select class="form-select" id="note-type" style="max-width:180px;">
                  <option>General</option><option>Hearing Update</option><option>Client Meeting</option>
                  <option>Internal Remark</option><option>Research Note</option><option>Action Item</option>
                </select>
                <select class="form-select" id="note-importance" style="max-width:120px;">
                  <option>Normal</option><option>Important</option><option>Critical</option>
                </select>
              </div>
              <textarea class="form-textarea" id="note-content" placeholder="Add a case note or update..." rows="4"></textarea>
              <div style="display:flex;justify-content:flex-end;margin-top:10px;">
                <button class="btn btn-primary" onclick="addNote()" id="add-note-btn">➕ Add Note</button>
              </div>
            </div>

            <!-- Timeline -->
            <div class="card">
              <div class="card-header"><div class="card-title">📋 Timeline</div><span id="note-count" style="font-size:12px;color:var(--text-muted);"></span></div>
              <div class="timeline" id="notes-timeline">
                <div class="loading-overlay" style="padding:32px;"><div class="spinner"></div></div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="toast-container"></div>
<script src="../js/ui.js"></script><script src="../js/api.js"></script>
<script src="../js/sidebar.js"></script><script src="../js/notes.js"></script>
</body></html>
